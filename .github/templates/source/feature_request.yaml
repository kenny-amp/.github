id: feature_request
name: "機能追加・変更要求 (Feature Request)"
description: "新規機能の追加や既存仕様の変更を行う場合"
title_prefix: "[Feature]: "
labels: [enhancement, feature]

sections:
  - id: context
    heading: "1. 前提・背景 (Context & User Story)"
    kind: textarea
    description: "ISO 29148: システムが必要とされる背景・ユーザーのペルソナや利用シーンを記述してください。"
    sub_labels:
      - "対象ユーザー"
      - "現状の課題・ニーズ"
    required: true

  - id: goal
    heading: "2. 目的・価値 (Goal & Business Value)"
    kind: textarea
    description: "この変更により達成される状態とビジネス・技術的なインパクトを記述してください。"
    required: true

  - id: priority
    heading: "3. 優先度 (Priority)"
    kind: dropdown
    description: "ISO 29148: 要求属性としての優先度（MoSCoW法）"
    options:
      - "Must（必須）— これが無いとリリースできない"
      - "Should（重要）— 重要だが代替手段がある"
      - "Could（任意）— あれば望ましい"
      - "Won't（今回は見送り）— 将来検討"
    required: true

  - id: constraints
    heading: "4. 前提条件・制約 (Assumptions & Constraints)"
    kind: textarea
    description: "ISO 29148: この要求が成立する前提や、技術的・組織的な制約を記述してください。"
    md_body: "-"

  - id: in_scope
    heading: "5-1. やること (In Scope)"
    kind: textarea
    md_body: "- [ ] "
    placeholder: "- [ ] "
    required: true

  - id: out_of_scope
    heading: "5-2. やらないこと (Out of Scope)"
    kind: textarea
    description: "Scope Creep（範囲拡大）を防ぐため、今回あえて含めない作業を記述します。"
    md_body: "-"

  - id: approach
    heading: "6. 実装・設計方針 (Proposed Approach)"
    kind: textarea
    description: "検討している技術的アプローチ、設計案、アーキテクチャへの影響を記述してください。"

  - id: risk_assessment
    heading: "7. 非機能要件・リスク評価 (Non-Functional & Risk Assessment)"
    kind: checkboxes
    description: "ISO 29148 / ISO 27001: 性能、セキュリティ、互換性に関する事前チェック"
    items:
      - "パフォーマンスやレスポンス速度への重大な影響はないか？"
      - "セキュリティ・個人情報（PII）の取り扱いに変更はあるか？"
      - "既存APIやDB構造の破壊的変更（Breaking Change）が含まれるか？"

  - id: rollback_plan
    heading: "8. ロールバック / バックアウト計画 (Rollback & Backout Plan)"
    kind: textarea
    description: "ITIL V4 Change Enablement: リリース後に問題が発生した場合の切り戻し手順を記述してください。"
    md_body: "-"

  - id: verification_method
    heading: "9. 検証方法 (Verification Method)"
    kind: dropdown
    description: "ISO 29148: 完了条件をどのように検証するか"
    options:
      - "テスト (Test)"
      - "デモンストレーション (Demonstration)"
      - "検査 (Inspection)"
      - "分析 (Analysis)"
    required: true

  - id: acceptance_criteria
    heading: "10. 完了条件 (Acceptance Criteria)"
    kind: textarea
    description: "ISO 29148: 検証可能性（Verifiability）の担保。何をもって完了とするかを記述します。"
    value:
      - "ユニットテスト/統合テストの追加および通過"
      - "対象環境での動作検証（検証環境: ）"
      - "関連ドキュメント（仕様書、APIドキュメント等）の更新"
    required: true

  - id: traceability
    heading: "11. トレーサビリティ・依存関係 (Traceability & Dependencies)"
    kind: textarea
    description: "ISO 12207: 要求とタスク間の追跡性"
    example_lines:
      - ["親イシュー", "123"]
      - ["ブロッキング / 依存関係", "456"]
