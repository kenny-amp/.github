id: feature_request
name: "機能追加・変更要求 (Feature Request)"
description: "新規機能の追加や既存仕様の変更を行う場合"
title_prefix: "[Feature]: "
labels: [enhancement, feature]

sections:
  - id: context
    heading: "1. 前提・背景 (Context & User Story)"
    kind: textarea
    description: "ISO 29148: システムが必要とされる背景・ユーザーのペルソナや利用シーンを記述してください。"
    sub_labels:
      - "対象ユーザー"
      - "現状の課題・ニーズ"
    required: true

  - id: goal
    heading: "2. 目的・価値 (Goal & Business Value)"
    kind: textarea
    description: "この変更により達成される状態とビジネス・技術的なインパクトを記述してください。"
    required: true

  - id: in_scope
    heading: "3-1. やること (In Scope)"
    kind: textarea
    md_body: "- [ ] "
    placeholder: "- [ ] "
    required: true

  - id: out_of_scope
    heading: "3-2. やらないこと (Out of Scope)"
    kind: textarea
    description: "Scope Creep（範囲拡大）を防ぐため、今回あえて含めない作業を記述します。"
    md_body: "-"

  - id: approach
    heading: "4. 実装・設計方針 (Proposed Approach)"
    kind: textarea
    description: "検討している技術的アプローチ、設計案、アーキテクチャへの影響を記述してください。"

  - id: risk_assessment
    heading: "5. 非機能要件・リスク評価 (Non-Functional & Risk Assessment)"
    kind: checkboxes
    description: "ISO 29148 / ISO 27001: 性能、セキュリティ、互換性に関する事前チェック"
    items:
      - "パフォーマンスやレスポンス速度への重大な影響はないか？"
      - "セキュリティ・個人情報（PII）の取り扱いに変更はあるか？"
      - "既存APIやDB構造の破壊的変更（Breaking Change）が含まれるか？"

  - id: acceptance_criteria
    heading: "6. 完了条件 (Acceptance Criteria)"
    kind: textarea
    description: "ISO 29148: 検証可能性（Verifiability）の担保。何をもって完了とするかを記述します。"
    value:
      - "ユニットテスト/統合テストの追加および通過"
      - "対象環境での動作検証（検証環境: ）"
      - "関連ドキュメント（仕様書、APIドキュメント等）の更新"
    required: true

  - id: traceability
    heading: "7. トレーサビリティ・依存関係 (Traceability & Dependencies)"
    kind: textarea
    description: "ISO 12207: 要求とタスク間の追跡性"
    example_lines:
      - ["親イシュー", "123"]
      - ["ブロッキング / 依存関係", "456"]
