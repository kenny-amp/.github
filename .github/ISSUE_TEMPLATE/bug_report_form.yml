name: "不具合・障害報告 (Bug Report)"
description: "システムの意図しない動作・エラー・障害を報告する場合"
title: "[Bug]: "
labels:
  - "bug"
  - "priority-triage"
body:
  - type: textarea
    id: summary
    attributes:
      label: "1. 事象の概要 (Summary)"
      description: "何が起きているかを簡潔に記述してください。"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "2. 再現手順 (Steps to Reproduce)"
      placeholder: "1. ◯◯画面を開く\n2. △△ボタンを押す\n3. エラーが表示される"
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: "3. 期待する挙動 vs 実際の挙動 (Expected vs Actual)"
      placeholder: "期待する動作: \n実際の動作: "
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "4. 発生環境 (Environment)"
      description: "ITIL: 構成要素 (CI) の特定"
      options:
        - "本番環境 (Production)"
        - "ステージング環境 (Staging)"
        - "開発・ローカル環境 (Dev/Local)"
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "5. 影響度 (Impact)"
      description: "ITIL: 優先度判定用"
      options:
        - "高: 全ユーザーまたは主要機能が停止している"
        - "中: 一部ユーザーまたは特定の機能に支障がある"
        - "低: 軽微な表示崩れや回避策がある事象"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "6. ログ・証跡 (Logs & Screenshots)"
      description: "エラーログ、スタックトレース、またはスクリーンショットを貼り付けてください。"

  - type: textarea
    id: hypothesis
    attributes:
      label: "7. 仮説・回避策 (Hypothesis & Workaround)"
      placeholder: "原因の仮説:\n暫定回避策:"

  - type: textarea
    id: resolution_criteria
    attributes:
      label: "8. 完了条件 (Resolution Criteria)"
      value: |
        - [ ] 原因の特定と恒久対策（コード修正）の完了
        - [ ] 再現テストケースの作成とテスト通過
        - [ ] 対象環境での修正確認
    validations:
      required: true
