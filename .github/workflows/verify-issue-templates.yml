# .github/templates/source/*.yaml から生成される Issue テンプレート
# （.github/ISSUE_TEMPLATE/*.md, *_form.yml）が最新かどうかを検証する。
# ソースを直接編集しても generate_issue_templates.py --write を忘れると
# ここで検知される。
name: verify-issue-templates

on:
  pull_request:
    paths:
      - ".github/templates/**"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths:
      - ".github/templates/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Verify generated Issue templates are up to date
        run: python .github/templates/generate_issue_templates.py --check
