# .github/templates/source/*.yaml から生成される Issue テンプレート
# （.github/ISSUE_TEMPLATE/*.md, *_form.yml）が最新かどうかを検証する。
# ソースを直接編集しても generate_issue_templates.py --write を忘れると
# ここで検知される。
#
# 注意: このジョブ（check）は Repository Rulesets の必須ステータスチェックに
#       指定されている。paths フィルタを付けると対象外のファイルしか変更しない
#       PR ではジョブ自体が起動せず、必須チェックが永久に「Expected — Waiting」
#       のままとなりマージ不可になる（2026-09-25 Dependabot PR #2 で実害）。
#       スクリプト自体は軽量なため、path フィルタを付けず全PR/pushで実行する。
name: verify-issue-templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Verify generated Issue templates are up to date
        run: python .github/templates/generate_issue_templates.py --check
