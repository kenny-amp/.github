# 組織共通の再利用可能ワークフロー: シークレットスキャン（gitleaks）
#
# 呼び出し例（各リポジトリの .github/workflows/secret-scan.yml）:
#   name: secret-scan
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     gitleaks:
#       uses: kenny-amp/.github/.github/workflows/reusable-secret-scan.yml@main
#       with:
#         config-path: .gitleaks.toml              # 省略可（存在しない場合は既定ルールで実行）
#         baseline-path: .gitleaks-baseline.json    # 省略可
#
# 前提: 既知の誤検知を除外するため、呼び出し元リポジトリに `.gitleaks.toml` を用意することを推奨。
name: reusable-secret-scan

on:
  workflow_call:
    inputs:
      config-path:
        description: "gitleaks 設定ファイルのパス（存在しない場合は既定ルールを使用）"
        type: string
        default: ".gitleaks.toml"
      baseline-path:
        description: "gitleaks ベースラインファイルのパス（存在しない場合は無視）"
        type: string
        default: ".gitleaks-baseline.json"
      gitleaks-version:
        description: "使用する gitleaks の Docker イメージタグ"
        type: string
        default: "v8.30.1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve optional config/baseline flags
        id: flags
        run: |
          FLAGS=""
          if [ -f "${{ inputs.config-path }}" ]; then
            FLAGS="$FLAGS --config /repo/${{ inputs.config-path }}"
          fi
          if [ -f "${{ inputs.baseline-path }}" ]; then
            FLAGS="$FLAGS --baseline-path /repo/${{ inputs.baseline-path }}"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run gitleaks (PR diff)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:${{ inputs.gitleaks-version }} \
            detect --source /repo ${{ steps.flags.outputs.flags }} \
            --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact --verbose

      - name: Run gitleaks (full scan)
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:${{ inputs.gitleaks-version }} \
            detect --source /repo ${{ steps.flags.outputs.flags }} \
            --redact --verbose
