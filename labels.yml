# 組織共通ラベル定義（各リポジトリの Issue テンプレートが参照するラベル）。
#
# .github/workflows/reusable-label-sync.yml から参照される唯一のソースです。
# 各リポジトリはこのファイルを直接コピーせず、reusable-label-sync.yml を
# workflow_call で呼び出すことでラベルを同期してください。
#
# 参考: GitHub新規リポジトリのデフォルトラベルは bug / enhancement など少数のみで、
# 以下のカスタムラベルは各リポジトリで作成しないとIssueテンプレートの
# labels: 指定が（エラーにならず）サイレントに無視されます。
#
# 2026-09-26: feature / refactoring / spike を削除（ユーザー指摘により類似ラベルの
# 乱立を解消）。各テンプレートが2ラベルを同時付与する設計自体は bug+priority-triage /
# problem+root-cause のように「種別 + 直交する属性」であれば有用だが、
# feature_request の enhancement+feature・task_maintenance の maintenance+refactoring・
# research_spike の research+spike は属性軸が直交しておらずほぼ同義語だった
# （research の description 自体が既に「Research / Spike」を包含）。組織内の
# 全リポジトリでこれら3ラベルを実際に使用しているIssueが0件であることを確認済みのため、
# 既存Issueの再ラベリングは不要（`.github/templates/source/*.yaml` の labels 側も
# 対応するコミットで更新済み）。

- name: bug
  color: "d73a4a"
  description: "不具合・障害報告 (Bug Report)"

- name: enhancement
  color: "a2eeef"
  description: "機能追加・変更要求 (Feature Request)"

- name: priority-triage
  color: "fbca04"
  description: "優先度の一次トリアージが未実施"

- name: maintenance
  color: "c5def5"
  description: "作業・技術改善 (Task / Maintenance)"

- name: research
  color: "d4c5f9"
  description: "調査・スパイク (Research / Spike)"

- name: problem
  color: "5319e7"
  description: "問題記録 (Problem Record) — ITIL V4 Problem Management"

- name: root-cause
  color: "8b1e3f"
  description: "根本原因が特定されている"
